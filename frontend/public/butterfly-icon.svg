<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <radialGradient id="wing-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>
  </defs>
  <!-- Left wings -->
  <ellipse cx="30" cy="38" rx="22" ry="16" fill="url(#wing-grad)" opacity="0.9" transform="rotate(-20 30 38)"/>
  <ellipse cx="28" cy="62" rx="16" ry="11" fill="url(#wing-grad)" opacity="0.75" transform="rotate(15 28 62)"/>
  <!-- Right wings -->
  <ellipse cx="70" cy="38" rx="22" ry="16" fill="url(#wing-grad)" opacity="0.9" transform="rotate(20 70 38)"/>
  <ellipse cx="72" cy="62" rx="16" ry="11" fill="url(#wing-grad)" opacity="0.75" transform="rotate(-15 72 62)"/>
  <!-- Body -->
  <ellipse cx="50" cy="50" rx="4" ry="22" fill="#064e3b"/>
  <!-- Antennae -->
  <line x1="50" y1="28" x2="38" y2="15" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="28" x2="62" y2="15" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="38" cy="14" r="2" fill="#34d399"/>
  <circle cx="62" cy="14" r="2" fill="#34d399"/>
</svg>
